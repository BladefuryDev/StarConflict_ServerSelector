name: Build & Release Patcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.2.0)'
        required: true
        default: 'v1.2.2'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows Executable & Portable Bundle
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.2.2" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build standalone executable (PyInstaller)
        run: |
          python -m PyInstaller --onefile --noconsole --name StarConflict_Patcher --icon=star_conflict.ico --add-data "star_conflict.ico;." --add-data "server_selector_mod.lua;." --add-data "omega_ui.py;." --add-data "ui_overhaul;ui_overhaul" StarConflict_Patcher.pyw

      - name: Create Portable Zip Package
        shell: powershell
        run: |
          Compress-Archive -Path "StarConflict_Patcher.pyw", "omega_ui.py", "star_conflict.ico", "server_selector_mod.lua", "ui_overhaul", "README.md", "TECHNICAL.md", "CHANGELOG.md", "Launch_Patcher.bat" -DestinationPath "dist\StarConflict_Patcher_Portable.zip" -Force

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          tag="${{ steps.release_tag.outputs.tag }}"
          awk -v t="## $tag" 'index($0, t) == 1 { f = 1; next } /^## / { if (f) exit } f' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then echo "CHANGELOG.md has no '## $tag' section" >&2; exit 1; fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            dist/StarConflict_Patcher.exe
            dist/StarConflict_Patcher_Portable.zip
          body_path: release_notes.md
          draft: false
          prerelease: false
